<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Play Plus Popup</title>
  </head>
  <body class="w-[350px] p-4 bg-teal-50 select-none">
    <div class="flex flex-col gap-3">
      <h1 class="text-2xl font-bold text-teal-500">Play Plus</h1>
      <p class="text-gray-600">쿠팡플레이의 기능들을 개인 맞춤 설정하여 이용하세요!</p>
      <div class="flex items-center gap-2">
        <label for="skip-time" class="text-nowrap">영상 이동 시간(초):</label>
        <input type="number" id="skip-time" value="10" min="1" class="border outline-none rounded px-2 py-1 w-full" />
        <div id="feedback" class="hidden">✔</div>
        <button id="save-skip-time" class="px-2 py-1 bg-teal-500 text-white rounded text-nowrap">저장</button>
      </div>
    </div>
  </body>
</html>
