<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Play Plus</title>
  </head>
  <body class="p-4 select-none text-nowrap">
    <div class="flex flex-col gap-4">
      <header class="flex flex-col gap-2">
        <div class="flex gap-2 items-center">
          <img src="icons/play-plus_48x.png" alt="logo" class="w-8" />
          <h1 class="text-2xl font-bold text-teal-500">Play Plus</h1>
        </div>
        <p class="text-gray-600">쿠팡플레이의 기능을 확장하고, 원하는 대로 커스텀하세요.</p>
      </header>

      <section class="flex flex-col gap-1">
        <header class="flex justify-between items-center h-[26px]">
          <h2 class="text-sm font-semibold">영어 자막</h2>
          <button id="save-english-setting" class="button bg-teal-500 hidden" disabled>저장</button>
          <div id="english-toggle"></div>
        </header>
        <div id="english-subtitle-setting" class="flex flex-col gap-1">
          <div class="flex items-center gap-2">
            <label for="english-color-picker_input" class="label">자막 색상:</label>
            <div id="english-color-picker"></div>
          </div>
          <div class="flex items-center gap-2">
            <label for="english-font-size" class="label">자막 크기(1~10):</label>
            <input type="number" id="english-font-size" class="input" />
          </div>
          <div class="flex items-center gap-2 h-7">
            <label for="english-font-weight" class="label">글씨 굵기(1~6):</label>
            <input type="number" id="english-font-weight" class="input" />
          </div>
        </div>
      </section>

      <section class="flex flex-col gap-1">
        <header class="flex justify-between items-center h-[26px]">
          <h2 class="text-sm font-semibold">한국어 자막</h2>
          <button id="save-korean-setting" class="button bg-teal-500 hidden" disabled>저장</button>
          <div id="korean-toggle"></div>
        </header>
        <div id="korean-subtitle-setting" class="flex flex-col gap-1">
          <div class="flex items-center gap-2">
            <label for="korean-color-picker_input" class="label">자막 색상:</label>
            <div id="korean-color-picker"></div>
          </div>
          <div class="flex items-center gap-2">
            <label for="korean-font-size" class="label">자막 크기(1~10):</label>
            <input type="number" id="korean-font-size" class="input" />
          </div>
          <div class="flex items-center gap-2 h-7">
            <label for="korean-font-weight" class="label">글씨 굵기(1~6):</label>
            <input type="number" id="korean-font-weight" class="input" />
          </div>
        </div>
      </section>

      <section class="flex flex-col gap-1">
        <header class="flex justify-between items-center h-[26px]">
          <h2 class="text-sm font-semibold">메인 키 (←/→)</h2>
          <div class="flex items-center gap-2">
            <button id="save-skip-time" class="button bg-teal-500" disabled>저장</button>
          </div>
        </header>
        <div class="flex items-center gap-2">
          <label for="skip-time" class="label">영상 이동 시간(초):</label>
          <input type="number" id="skip-time" class="input" />
        </div>
      </section>

      <section class="flex flex-col gap-1">
        <header class="flex justify-between items-center h-[26px]">
          <h2 class="text-sm font-semibold">서브 키 (맞춤 설정)</h2>
          <div class="flex items-center gap-2">
            <button id="save-sub-key" class="button bg-teal-500 hidden" disabled>저장</button>
            <div id="sub-key-toggle"></div>
          </div>
        </header>
        <div id="sub-key-setting" class="flex flex-col gap-1">
          <div class="flex items-center gap-2">
            <label for="sub-backward-key" class="label">뒤로 이동 키:</label>
            <input id="sub-backward-key" class="input" readonly />
          </div>
          <div class="flex items-center gap-2">
            <label for="sub-forward-key" class="label">앞으로 이동 키:</label>
            <input id="sub-forward-key" class="input" readonly />
          </div>
          <div class="flex items-center gap-2">
            <label for="sub-skip-time" class="label">영상 이동 시간(초):</label>
            <input type="number" id="sub-skip-time" class="input" />
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
